<!DOCTYPE html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MM Escrow — Myanmar Freelance Escrow Platform</title>
    <meta name="description" content="A trusted freelance escrow platform for Myanmar — secure payments, digital contracts, and local payment methods." />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', '"Noto Sans Myanmar"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <!-- Google Fonts: Inter + Noto Sans Myanmar -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Myanmar:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />

    <style>
      /* ---- Base ---- */
      * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body { font-family: 'Inter', 'Noto Sans Myanmar', system-ui, sans-serif; }

      /* ---- Input Field ---- */
      .input-field {
        width: 100%;
        padding: 0.625rem 0.875rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        background: #fff;
        outline: none;
        transition: all 0.2s;
      }
      .input-field:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
      }
      .input-field::placeholder { color: #94a3b8; }

      /* ---- Buttons ---- */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.625rem 1.25rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
        font-weight: 600;
        font-size: 0.875rem;
        border-radius: 0.75rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 8px rgba(99,102,241,0.25);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(99,102,241,0.35);
      }
      .btn-primary:active { transform: translateY(0); }

      .btn-primary-sm {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.5rem 1rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
        font-weight: 600;
        font-size: 0.8125rem;
        border-radius: 0.625rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 6px rgba(99,102,241,0.2);
      }
      .btn-primary-sm:hover {
        transform: translateY(-1px);
        box-shadow: 0 3px 12px rgba(99,102,241,0.3);
      }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.625rem 1.25rem;
        background: #f8fafc;
        color: #475569;
        font-weight: 600;
        font-size: 0.875rem;
        border-radius: 0.75rem;
        border: 1px solid #e2e8f0;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-ghost:hover {
        background: #f1f5f9;
        border-color: #cbd5e1;
      }

      .btn-sm {
        padding: 0.375rem 0.75rem;
        font-size: 0.8125rem;
        border-radius: 0.5rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-sm.btn-primary {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
      }
      .btn-sm.btn-ghost {
        background: #f8fafc;
        color: #475569;
        border: 1px solid #e2e8f0;
      }
      .btn-sm.btn-danger {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
      }

      /* ---- Nav Link ---- */
      .nav-link {
        padding: 0.375rem 0.75rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #64748b;
        border-radius: 0.5rem;
        transition: all 0.2s;
        text-decoration: none;
      }
      .nav-link:hover {
        color: #6366f1;
        background: #f5f3ff;
      }

      /* ---- Animations ---- */
      @keyframes slide-in {
        from { opacity: 0; transform: translateX(1rem); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(0.5rem); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-in { animation: slide-in 0.3s ease-out; }
      .animate-scale-in { animation: scale-in 0.2s ease-out; }
      .animate-fade-in { animation: fade-in 0.4s ease-out; }

      /* ---- Scrollbar ---- */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* ---- Line Clamp ---- */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen">
    <!-- Navbar Container -->
    <div id="navbar"></div>

    <!-- Main App Container -->
    <div id="app" class="animate-fade-in"></div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- App Entry Point -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
